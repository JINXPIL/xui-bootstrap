# ============================================================================
#  Mihomo / Clash Meta конфиг для FlClash (Android) и Clash Verge Rev (ПК)
#  Совместим с Xray-core 26.9.9 (3x-ui v3.8.5). Крым/РФ, 2026.
#
#  Заполни ПЛЕЙСХОЛДЕРЫ (из панели 3x-ui, кнопка «ссылка/share» у инбаунда):
#    SERVER_IP      — IP твоего VPS
#    UUID           — id клиента VLESS (XHTTP-Reality)
#    REALITY_SNI    — serverNames инбаунда (напр. vk.com) — поле "servername"
#    PUBLIC_KEY     — публичный ключ Reality
#    SHORT_ID       — shortId Reality (hex)
#    XHTTP_PATH     — path XHTTP-инбаунда (напр. /a1b2)
#    H2_PASSWORD    — пароль (auth) Hysteria2
#    CERT_HOST      — на что выпущен TLS-серт Hysteria2 (при LE-на-IP = SERVER_IP)
#
#  ВАЖНО для Xray 26.9.8+: client-fingerprint: chrome и
#  support-x25519mlkem768: true ВНУТРИ reality-opts (в Mihomo это поле
#  reality-opts; уровнем выше оно молча игнорируется).
# ============================================================================

mixed-port: 7890
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: 'off'

# Снифер нужен, чтобы доменные правила (Google/Gemini) срабатывали и на fake-ip,
# иначе часть трафика уходит по IP мимо правил.
sniffer:
  enable: true
  override-destination: true
  sniff:
    TLS:  { ports: [443] }
    QUIC: { ports: [443] }
    HTTP: { ports: [80, 8080-8880] }
  skip-domain:
    - "+.push.apple.com"
    - "+.wechat.com"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "geosite:category-ru"          # локальные РФ-домены резолвим реально
  # Имя/IP сервера резолвим «чистым» DNS, чтобы не зависеть от РФ-резолвера
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  # Иностранное — через DoH (без утечки в РФ-DNS); fake-ip + прокси резолвит на сервере
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  # РФ-домены — через быстрый локальный резолвер
  nameserver-policy:
    "geosite:category-ru,private": [223.5.5.5, system]

proxies:
  # --- 1. VLESS XHTTP + Reality (основной TCP, порт 443) ---
  # XHTTP — рекомендованная Xray замена устаревающему gRPC.
  - name: "XHTTP-Reality"
    type: vless
    server: SERVER_IP
    port: 443
    uuid: UUID
    udp: true
    tls: true
    flow: ""                         # для XHTTP flow пустой
    network: xhttp
    servername: REALITY_SNI
    client-fingerprint: chrome
    reality-opts:
      public-key: PUBLIC_KEY
      short-id: "SHORT_ID"
      support-x25519mlkem768: true   # PQ-обмен ключами (Xray 26.9.8+)
    xhttp-opts:
      path: "XHTTP_PATH"
      mode: auto                     # с Reality = stream-one; при залипаниях — packet-up

  # --- 2. Hysteria2 (UDP 443, QUIC) ---
  - name: "Hysteria2"
    type: hysteria2
    server: SERVER_IP
    port: 443
    password: H2_PASSWORD
    sni: CERT_HOST                   # = на что выпущен серт (LE-на-IP → SERVER_IP)
    alpn: ["h3"]
    skip-cert-verify: false          # серт доверенный (Let's Encrypt). Для self-signed → true
    up: "20 mbps"
    down: "100 mbps"

  # --- (опционально) gRPC Reality, порт 2087 — если добавил grpc-reality ---
  # - name: "gRPC-Reality"
  #   type: vless
  #   server: SERVER_IP
  #   port: 2087
  #   uuid: UUID
  #   tls: true
  #   flow: ""
  #   network: grpc
  #   servername: REALITY_SNI
  #   client-fingerprint: chrome
  #   reality-opts: { public-key: PUBLIC_KEY, short-id: "SHORT_ID", support-x25519mlkem768: true }
  #   grpc-opts: { grpc-service-name: "GRPC_SERVICE" }

  # --- (опционально) VLESS WebSocket + TLS, порт 8444 — если добавил ws-tls ---
  # Устаревший в Xray транспорт, но его понимают почти все клиенты и CDN.
  # - name: "WS-TLS"
  #   type: vless
  #   server: SERVER_IP
  #   port: 8444
  #   uuid: UUID
  #   tls: true
  #   servername: CERT_HOST            # на что выпущен серт (LE-на-IP → SERVER_IP)
  #   alpn: [http/1.1]                 # WebSocket работает только поверх HTTP/1.1
  #   client-fingerprint: chrome
  #   skip-cert-verify: false          # серт доверенный (Let's Encrypt)
  #   network: ws
  #   ws-opts: { path: "WS_PATH", headers: { Host: CERT_HOST } }

proxy-groups:
  - name: "PROXY"
    type: fallback                   # Hysteria2 (UDP) основной: ТСПУ режет длинные TCP-сессии,
                                     # QUIC это обходит; при блоке UDP — автоматом XHTTP-Reality
    url: "http://cp.cloudflare.com/generate_204"
    interval: 300
    tolerance: 50
    proxies:
      - "Hysteria2"
      - "XHTTP-Reality"

  - name: "AI"                       # отдельная группа для Gemini/OpenAI
    type: select
    proxies:
      - "PROXY"
      - "XHTTP-Reality"
      - "Hysteria2"

rule-providers: {}

rules:
  # локальное — напрямую
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT

  # --- Gemini / Google AI и прочее, что блокирует РФ, — ЧЕРЕЗ ПРОКСИ ---
  - DOMAIN-SUFFIX,gemini.google.com,AI
  - DOMAIN-SUFFIX,aistudio.google.com,AI
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,AI
  - DOMAIN-SUFFIX,ai.google.dev,AI
  - DOMAIN-SUFFIX,makersuite.google.com,AI
  - DOMAIN-KEYWORD,gemini,AI
  - GEOSITE,google-gemini,AI
  - GEOSITE,openai,AI
  - GEOSITE,google,AI
  # Gemini/Chrome любят QUIC — не пускаем Google по UDP/443 напрямую,
  # иначе трафик утекает мимо прокси и «то работает, то нет».
  - AND,((NETWORK,udp),(DST-PORT,443),(GEOSITE,google)),REJECT

  # реклама/трекеры
  - GEOSITE,category-ads-all,REJECT

  # --- РФ/Крым — напрямую (быстро, без прокси) ---
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT

  # всё остальное — через прокси
  - MATCH,PROXY
