name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq shellcheck jq nftables
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /tmp/shfmt
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          shopt -s globstar nullglob
          files=(bootstrap.sh deploy.sh bin/xui-fw-sync lib/*.sh tests/*.sh)
          echo "Проверяю: ${files[*]}"
          shellcheck -S warning -x "${files[@]}"

      - name: shfmt (проверка форматирования)
        run: shfmt -d -i 2 -ci bootstrap.sh deploy.sh bin/xui-fw-sync lib/*.sh tests/*.sh || true

  validate:
    name: JSON / routing / nftables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq jq nftables

      - name: JSON-шаблоны — синтаксис
        run: |
          for f in inbounds/*.json.example; do
            jq -e . "$f" >/dev/null && echo "ok: $f"
          done

      - name: Оффлайн-проверки (рендеринг, маршрутизация, nft)
        run: sudo bash tests/validate.sh
