name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Раз в неделю: шаблоны против СВЕЖИХ релизов Xray и Mihomo. Если Xray удалит
  # функцию, которой пользуются шаблоны, CI покраснеет раньше, чем сломается сервер.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Shell lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq shellcheck jq nftables
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 -o /tmp/shfmt
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          shopt -s globstar nullglob
          files=(bootstrap.sh deploy.sh update-tools.sh selfcheck.sh bin/xui-fw-sync bin/xui-warp bin/xui-update lib/*.sh tests/*.sh)
          echo "Проверяю: ${files[*]}"
          shellcheck -S warning -x "${files[@]}"

      - name: shfmt (проверка форматирования)
        run: shfmt -d -i 2 -ci bootstrap.sh deploy.sh update-tools.sh selfcheck.sh bin/xui-fw-sync bin/xui-warp bin/xui-update lib/*.sh tests/*.sh || true

  validate:
    name: Офлайн-проверки и поведенческие тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq jq nftables python3-yaml iproute2 openssl

      - name: validate.sh (шаблоны, маршрутизация, nft, WARP, SSL, идемпотентность)
        run: sudo bash tests/validate.sh

  compat:
    name: Совместимость с Xray ${{ matrix.xray }} и Mihomo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # закреплённая боевая версия + последний релиз
        xray: ["v26.9.30", "latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq jq python3-yaml openssl

      - name: Шаблоны против настоящего Xray (xray run -test)
        env:
          XRAY_DOWNLOAD: "1"
          XRAY_VERSION: ${{ matrix.xray != 'latest' && matrix.xray || '' }}
        run: bash tests/xray_test.sh

      - name: Клиентский шаблон против настоящего Mihomo (mihomo -t)
        if: matrix.xray == 'latest'
        env:
          MIHOMO_DOWNLOAD: "1"
        run: bash tests/mihomo_test.sh
